# ================================================
# APPLICATION
# ================================================
spring.application.name=rrm-parking-platform
server.port=8080
# ================================================
# DATABASE - XAMPP MySQL
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/rrm_parking?useSSL=false&serverTimezone=Africa/Casablanca&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================================================
# FLYWAY
# ================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ================================================
# JWT
# ================================================
app.jwt.secret=rrm-parking-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

# ================================================
# FILE STORAGE
# ================================================
app.storage.base-path=C:/rrm-parking-storage

# ================================================
# MAIL (configure later with Brevo)
# ================================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=your-brevo-email
spring.mail.password=your-brevo-key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================================================
# LOGGING
# ================================================
logging.level.com.rrm.parking=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO