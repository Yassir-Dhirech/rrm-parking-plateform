# APPLICATION
spring.application.name=rrm-parking-platform
server.port=8081

# DATABASE - XAMPP / MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/rrm_parking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# FLYWAY - TEMPORAIREMENT DESACTIVE
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${RRM_JWT_SECRET}
app.jwt.issuer=rrm-parking-platform
app.jwt.access-token-expiration=PT15M
app.jwt.expiration-ms=86400000

# FILE STORAGE
app.storage.base-path=C:/rrm-parking-storage

# MAIL - CONFIGURATION BREVO A COMPLETER
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=your-brevo-email
spring.mail.password=your-brevo-key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# LOGGING
logging.level.com.rrm.parking=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO

# INITIALISATION ADMINISTRATEUR - TEMPORAIRE
app.bootstrap.enabled=${RRM_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin-email=${RRM_ADMIN_EMAIL:}
app.bootstrap.admin-password=${RRM_ADMIN_PASSWORD:}

# ================================================
# OTP PROVIDER
# ================================================

app.otp.provider=${RRM_OTP_PROVIDER:simulation}

# ================================================
# TWILIO - TEST UNIQUEMENT
# ================================================

app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.sms-from=${TWILIO_SMS_FROM:}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}