# APPLICATION
spring.application.name=rrm-parking-platform
server.port=8081

# DATASOURCE (DOCKER / MYSQL / TIDB CLOUD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:rrm_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:rootpassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# 'update' préserve toutes les tables et données créées sans jamais les écraser
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HIKARI CONNECTION POOL (OPTIMISATION CLOUD)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# FLYWAY - TEMPORAIREMENT DESACTIVE
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${RRM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.issuer=rrm-parking-platform
app.jwt.access-token-expiration=PT15M
app.jwt.expiration-ms=86400000

# FILE STORAGE
app.storage.type=${RRM_STORAGE_TYPE:local}
app.storage.base-path=${RRM_STORAGE_PATH:C:/rrm-parking-storage}

# MAIL - CONFIGURATION BREVO A COMPLETER
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=your-brevo-email
spring.mail.password=your-brevo-key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# LOGGING
logging.level.com.rrm.parking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO

# INITIALISATION ADMINISTRATEUR - TEMPORAIRE
app.bootstrap.enabled=${RRM_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin-email=${RRM_ADMIN_EMAIL:}
app.bootstrap.admin-password=${RRM_ADMIN_PASSWORD:}

# ================================================
# OTP PROVIDER
# ================================================
app.otp.provider=${RRM_OTP_PROVIDER:simulation}

# ================================================
# TWILIO - TEST UNIQUEMENT
# ================================================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.sms-from=${TWILIO_SMS_FROM:}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

app.parking-data.enabled=${RRM_PARKING_DATA_ENABLED:false}
app.tarification.initialization.enabled=${RRM_TARIFF_INIT_ENABLED:false}
app.tarification.initialization.effective-date=${RRM_TARIFF_EFFECTIVE_DATE:2026-09-16}

app.integration.brevo.enabled=${RRM_BREVO_ENABLED:false}
app.integration.brevo.api-key=${RRM_BREVO_API_KEY:}
app.integration.brevo.sms-sender=${RRM_BREVO_SMS_SENDER:RRM}
app.integration.brevo.sms-enabled=${RRM_BREVO_SMS_ENABLED:false}
app.integration.brevo.sender-email=${RRM_BREVO_SENDER_EMAIL:}
app.integration.brevo.sender-name=${RRM_BREVO_SENDER_NAME:RRM Parking}

app.bootstrap.agent-enabled=${RRM_AGENT_BOOTSTRAP_ENABLED:false}
app.bootstrap.agent-email=${RRM_AGENT_EMAIL:}
app.bootstrap.agent-password=${RRM_AGENT_PASSWORD:}
app.bootstrap.agent-nom=${RRM_AGENT_NOM:Agent}
app.bootstrap.agent-prenom=${RRM_AGENT_PRENOM:Administratif}
app.bootstrap.supervisor-enabled=${RRM_SUPERVISOR_BOOTSTRAP_ENABLED:false}
app.bootstrap.supervisor-email=${RRM_SUPERVISOR_EMAIL:}
app.bootstrap.supervisor-password=${RRM_SUPERVISOR_PASSWORD:}
app.bootstrap.supervisor-nom=${RRM_SUPERVISOR_NOM:Superviseur}
app.bootstrap.supervisor-prenom=${RRM_SUPERVISOR_PRENOM:RRM}
app.bootstrap.responsable-enabled=${RRM_RESPONSABLE_BOOTSTRAP_ENABLED:false}
app.bootstrap.responsable-email=${RRM_RESPONSABLE_EMAIL:}
app.bootstrap.responsable-password=${RRM_RESPONSABLE_PASSWORD:}
app.bootstrap.responsable-nom=${RRM_RESPONSABLE_NOM:Responsable}
app.bootstrap.responsable-prenom=${RRM_RESPONSABLE_PRENOM:Stationnement}

app.storage.google-drive.folder-id=${RRM_GOOGLE_DRIVE_FOLDER_ID:1sG05PhR8PiMwJz-9Sz1Y6Q1dE94eSrMK}
app.storage.google-drive.credentials-path=${RRM_GOOGLE_DRIVE_CREDENTIALS_PATH:secrets/google-drive-oauth.json}
app.storage.google-drive.tokens-path=${RRM_GOOGLE_DRIVE_TOKENS_PATH:secrets/google-drive-tokens}

# ABONNEMENT - RAPPELS ET EXPIRATION AUTOMATIQUES
app.abonnement.expiration.cron=${RRM_ABONNEMENT_EXPIRATION_CRON:0 0 0 * * *}
app.frontend.renewal-url=${RRM_FRONTEND_RENEWAL_URL:http://localhost:5173/demande-publique?tab=RENEW}
