services:
  # 1. Base de données MySQL 8.0 locale (100% stable, hors-ligne, zéro latence)
  mysql:
    image: mysql:8.0
    container_name: rrm-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rrm_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. phpMyAdmin local sur http://localhost:8080
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: rrm-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

  # 3. Backend Spring Boot (Java 21) connecté au MySQL local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rrm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rrm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      RRM_TARIFF_INIT_ENABLED: "true"
      RRM_BOOTSTRAP_ENABLED: "true"
      RRM_ADMIN_EMAIL: admin@rrm.ma
      RRM_ADMIN_PASSWORD: Admin12345678!
      RRM_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RRM_STORAGE_PATH: /app/storage
      RRM_OTP_PROVIDER: ${RRM_OTP_PROVIDER:-brevo}
      RRM_BREVO_ENABLED: ${RRM_BREVO_ENABLED:-true}
      RRM_BREVO_API_KEY: ${RRM_BREVO_API_KEY}
      RRM_BREVO_SMS_SENDER: ${RRM_BREVO_SMS_SENDER:-RRM}
      RRM_BREVO_SENDER_EMAIL: ${RRM_BREVO_SENDER_EMAIL}
      RRM_BREVO_SENDER_NAME: ${RRM_BREVO_SENDER_NAME:-RRM Parking}
      RRM_BREVO_SMS_ENABLED: ${RRM_BREVO_SMS_ENABLED:-false}
    volumes:
      - backend_storage:/app/storage

  # 4. Frontend React SPA & Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SMS_OTP_ENABLED: ${RRM_BREVO_SMS_ENABLED:-false}
    container_name: rrm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"


volumes:
  mysql_data:
    name: rrm_mysql_data
  backend_storage:
    name: rrm_backend_storage
